<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registro de Entrega DAKA</title>
  <!-- Tesseract.js para OCR local -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- jsQR para lectura rápida de códigos QR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #111111;
      --text-muted: #555555;
      --primary: #075e54;
      --primary-hover: #0b8073;
      --accent: #25d366;
      --danger: #d9534f;
      --border-color: #cccccc;
      --preview-bg: #e5ddd5;
      --box-bg: #eef5f3;
      --shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --text-muted: #aaaaaa;
      --primary: #00a884;
      --primary-hover: #00c99f;
      --accent: #128c7e;
      --danger: #e53935;
      --border-color: #444444;
      --preview-bg: #2a2f32;
      --box-bg: #222d34;
      --shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 10px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 14px;
      width: 100%;
      box-shadow: var(--shadow);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h2 {
      color: var(--primary);
      margin: 0;
      font-size: 20px;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
    }

    label {
      font-weight: 600;
      font-size: 13px;
      margin-top: 10px;
      display: block;
      color: var(--text-muted);
    }

    input, textarea {
      width: 100%;
      padding: 9px 12px;
      margin-top: 4px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: var(--card-bg);
      color: var(--text-color);
      -webkit-user-select: text;
      user-select: text;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
    }

    .ocr-box {
      background: var(--box-bg);
      border: 2px dashed var(--primary);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .ocr-box input[type="file"] {
      display: none;
    }

    .btn-file {
      background: var(--primary);
      color: white;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      font-weight: bold;
      font-size: 14px;
      margin-top: 4px;
    }

    .btn-cam {
      background: var(--accent);
      color: #111;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      font-weight: bold;
      font-size: 14px;
      margin-top: 4px;
      border: none;
    }

    #status {
      font-size: 12px;
      color: var(--primary);
      margin-top: 6px;
      font-weight: 600;
      word-break: break-word;
    }

    /* Modal de la cámara en vivo */
    #scannerModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    #scannerModal video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      border: 2px solid white;
      object-fit: cover;
    }

    .scanner-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .thumb-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      justify-content: center;
    }

    .thumb-container img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button.action-btn {
      width: 100%;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-copy { background-color: var(--primary); }
    .btn-wa { background-color: var(--accent); }
    .btn-pdf { background-color: #d9534f; }
    .btn-excel { background-color: #2e7d32; }
    .btn-txt { background-color: #f57c00; }
    .btn-clear { background-color: var(--danger); margin-top: 8px; }

    .preview {
      background: var(--preview-bg);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      margin-top: 12px;
      min-height: 100px;
      color: #111;
      word-break: break-all;
    }

    .history-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      background: var(--box-bg);
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .history-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 230px;
      color: var(--text-color);
    }

    .history-btns {
      display: flex;
      gap: 4px;
    }

    .history-btns button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- MODAL CÁMARA QR EN VIVO -->
<div id="scannerModal">
  <p style="color: white; font-weight: bold; margin-bottom: 10px;">📷 Apunte al código QR de la etiqueta</p>
  <video id="qrVideo" playsinline></video>
  <canvas id="qrCanvas" style="display:none;"></canvas>
  <div class="scanner-controls">
    <button class="btn-file" onclick="cambiarCamara()" style="background-color: #0b8073;">🔄 Cambiar Cámara</button>
    <button class="btn-file" onclick="cerrarCamara()" style="background-color: #d9534f;">❌ Cerrar</button>
  </div>
  <div id="scanFeedback" style="color: #25d366; margin-top: 10px; font-weight: bold; min-height: 20px;"></div>
</div>

<div class="app-container">
  <div class="card">
    <div class="header-bar">
      <h2>📋 Registro DAKA</h2>
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Cambiar Tema">🌙</button>
    </div>

    <!-- Escáner QR en vivo y de respaldo -->
    <div class="ocr-box" style="margin-top: 12px;">
      <p style="font-size: 13px; font-weight: bold; margin: 0 0 4px 0; color: var(--primary);">⚡ Escáner QR Rápido con Cámara</p>
      
      <div style="display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap;">
        <button class="btn-cam" onclick="abrirCamara()">📸 Escanear con Cámara</button>
        <label for="imageInput" class="btn-file">📁 Subir Imagen</label>
      </div>

      <input type="file" id="imageInput" accept="image/*" multiple>
      <div id="status">Listo para escanear múltiples QR...</div>
      <div class="thumb-container" id="thumbs"></div>
    </div>

    <!-- Formulario -->
    <label for="destino">Destino:</label>
    <input type="text" id="destino" placeholder="Ej: Charallave">

    <label for="puerta">Número de Puerta:</label>
    <input type="text" id="puerta" placeholder="Ej: 3">

    <label for="mb">Código(s) MB:</label>
    <input type="text" id="mb" placeholder="Ej: MB00073925">

    <label for="pedido">Número(s) de Pedido:</label>
    <input type="text" id="pedido" placeholder="Ej: 90004144">

    <label for="r">R:</label>
    <input type="text" id="r" placeholder="Ej: R00123">

    <label for="cajas">Cantidad de Cajas Azules:</label>
    <input type="text" id="cajas" placeholder="Ej: 3">

    <label for="nota">Número(s) de Nota de Entrega:</label>
    <input type="text" id="nota" placeholder="Ej: 223699">

    <label for="dr">DR(s):</label>
    <input type="text" id="dr" placeholder="Ej: 19321">

    <label for="entrega">Inspector que entrega:</label>
    <input type="text" id="entrega" value="Gabriel López">

    <label for="recibe">Inspector que recibe:</label>
    <input type="text" id="recibe" placeholder="Ej: Aldo Rumbo">

    <div class="btn-group">
      <button class="action-btn btn-copy" onclick="copiarReporte()">📋 Copiar</button>
      <button class="action-btn btn-wa" onclick="abrirWhatsApp()">💬 WhatsApp</button>
    </div>
    
    <div class="btn-group" style="margin-top: 8px;">
      <button class="action-btn btn-pdf" onclick="exportarPDF()">📄 PDF</button>
      <button class="action-btn btn-excel" onclick="exportarExcel()">📊 Excel</button>
      <button class="action-btn btn-txt" onclick="exportarTXT()">💾 TXT</button>
    </div>

    <button class="action-btn" style="background-color: var(--primary); margin-top: 8px;" onclick="guardarRegistroHistorial()">📥 Guardar en Historial</button>
    <button class="action-btn btn-clear" onclick="limpiarFormulario()">🗑️ Limpiar Formulario</button>

    <label style="margin-top: 15px;">Vista previa:</label>
    <div class="preview" id="preview"></div>
  </div>

  <!-- Historial y Búsqueda -->
  <div class="card">
    <h3 style="margin-top: 0; font-size: 16px; color: var(--primary);">📜 Historial de Registros</h3>
    <input type="text" id="searchHistory" placeholder="🔍 Buscar en historial..." oninput="filtrarHistorial()">
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
  let mbsSet = new Set();
  let pedidosSet = new Set();
  let rSet = new Set();
  let notasSet = new Set();
  let drsSet = new Set();

  let videoStream = null;
  let scanningActive = false;
  let useFrontCamera = false;

  document.addEventListener('DOMContentLoaded', () => {
    inicializarTema();
    cargarUltimoRegistro();
    renderizarHistorial();

    document.getElementById('imageInput').addEventListener('change', manejarSeleccionImágenes);
    
    document.querySelectorAll('input, textarea').forEach(el => {
      el.addEventListener('input', () => {
        actualizarPreview();
        guardarEstadoActual();
      });
    });
  });

  function inicializarTema() {
    const savedTheme = localStorage.getItem('daka_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('daka_theme', next);
    document.getElementById('themeToggle').innerText = next === 'dark' ? '☀️' : '🌙';
  }

  function limpiarDuplicadosArray(arr) {
    return [...new Set(arr.filter(item => item && item !== 'null' && item !== ''))];
  }

  // --- CONTROL DE CÁMARA EN VIVO ---
  async function abrirCamara() {
    const modal = document.getElementById('scannerModal');
    modal.style.display = 'flex';
    scanningActive = true;

    try {
      const constraints = {
        video: { facingMode: useFrontCamera ? 'user' : 'environment' }
      };
      videoStream = await navigator.mediaDevices.getUserMedia(constraints);
      const videoElement = document.getElementById('qrVideo');
      videoElement.srcObject = videoStream;
      videoElement.play();
      requestAnimationFrame(cicloEscaneoCamara);
    } catch (err) {
      alert("No se pudo acceder a la cámara: " + err.message);
      cerrarCamara();
    }
  }

  function cerrarCamara() {
    scanningActive = false;
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    document.getElementById('scannerModal').style.display = 'none';
    document.getElementById('scanFeedback').innerText = '';
  }

  function cambiarCamara() {
    useFrontCamera = !useFrontCamera;
    cerrarCamara();
    abrirCamara();
  }

  function cicloEscaneoCamara() {
    if (!scanningActive) return;

    const video = document.getElementById('qrVideo');
    const canvas = document.getElementById('qrCanvas');
    
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code) {
        procesarDatosExtraidos(code.data);
        const feedback = document.getElementById('scanFeedback');
        feedback.innerText = `¡Escaneado con éxito! (${code.data})`;
        
        // Efecto visual rápido de lectura y pausa corta para evitar multi-lectura duplicada en 1 segundo
        setTimeout(() => {
          if (feedback) feedback.innerText = '';
        }, 1500);
      }
    }
    requestAnimationFrame(cicloEscaneoCamara);
  }

  function procesarDatosExtraidos(texto) {
    let datos = analizarTextoRegex(texto);
    if (!datos && (texto.toUpperCase().includes('MB') || /^\d+$/.test(texto))) {
      datos = { mb: texto, pedido: null, r: null, nota: null, dr: null, destino: null };
    }

    if (datos) {
      if (datos.mb) mbsSet.add(datos.mb.toString().trim());
      if (datos.pedido) pedidosSet.add(datos.pedido.toString().trim());
      if (datos.r) rSet.add(datos.r.toString().trim());
      if (datos.nota) notasSet.add(datos.nota.toString().trim());
      if (datos.dr) drsSet.add(datos.dr.toString().trim());
      if (datos.destino && !document.getElementById('destino').value) {
        document.getElementById('destino').value = datos.destino.toString().trim();
      }

      if (mbsSet.size > 0) document.getElementById('mb').value = limpiarDuplicadosArray(Array.from(mbsSet)).join(' / ');
      if (pedidosSet.size > 0) document.getElementById('pedido').value = limpiarDuplicadosArray(Array.from(pedidosSet)).join(' / ');
      if (rSet.size > 0) document.getElementById('r').value = limpiarDuplicadosArray(Array.from(rSet)).join(' / ');
      if (notasSet.size > 0) document.getElementById('nota').value = limpiarDuplicadosArray(Array.from(notasSet)).join(' / ');
      if (drsSet.size > 0) document.getElementById('dr').value = limpiarDuplicadosArray(Array.from(drsSet)).join(' / ');

      document.getElementById('status').innerText = '✅ ¡Nuevos elementos agregados por cámara!';
      actualizarPreview();
      guardarEstadoActual();
    }
  }

  function analizarTextoRegex(text) {
    const datos = { mb: null, pedido: null, r: null, nota: null, dr: null, destino: null };

    const mbMatch = text.match(/M\s*B\s*[:\s]*([0-9OIlSB]+)/i) || text.match(/\bMB\d+\b/i);
    if (mbMatch) {
      let limpio = (mbMatch[1] || mbMatch[0]).replace(/\s+/g, '').toUpperCase();
      if (!limpio.startsWith('MB')) limpio = 'MB' + limpio.replace(/^[A-Z]+/, '');
      datos.mb = limpio;
    }

    const pedidoMatch = text.match(/Pedido[:\s]*(\d+)/i) || text.match(/\b9000\d+\b/);
    if (pedidoMatch) datos.pedido = (pedidoMatch[1] || pedidoMatch[0]).trim();

    const rMatch = text.match(/R\s*[:\s]*(\d+)/i) || text.match(/\bR\d+\b/i);
    if (rMatch) datos.r = (rMatch[1] || rMatch[0]).replace(/\s+/g, '').toUpperCase();

    const notaMatch = text.match(/(?:Nota|N°|Entrega)[:\s]*(\d{5,})/i);
    if (notaMatch) datos.nota = notaMatch[1].trim();

    const drMatch = text.match(/DR[:\s]*(\d+)/i);
    if (drMatch) datos.dr = drMatch[1].trim();

    const destinoMatch = text.match(/(?:Sucursal|Destino)[:\s]*([A-Za-z\s]+)/i);
    if (destinoMatch) datos.destino = destinoMatch[1].trim();

    const validos = Object.values(datos).some(val => val !== null);
    return validos ? datos : null;
  }

  async function manejarSeleccionImágenes(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;

    const statusDiv = document.getElementById('status');
    const thumbsDiv = document.getElementById('thumbs');
    
    files.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      thumbsDiv.appendChild(img);
    });

    for (let i = 0; i < files.length; i++) {
      statusDiv.innerText = `Procesando imagen ${i + 1} de ${files.length}...`;
      
      // Intentar leer QR de la foto subida
      const reader = new FileReader();
      await new Promise(resolve => {
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            context.drawImage(img, 0, 0);
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code) {
              procesarDatosExtraidos(code.data);
            }
            resolve();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(files[i]);
      });
    }

    statusDiv.innerText = '✅ ¡Imágenes procesadas correctamente!';
    event.target.value = '';
  }

  function obtenerTextoReporte() {
    const destino = document.getElementById('destino').value || '[DESTINO]';
    const puertaVal = document.getElementById('puerta').value.trim() || '[PUERTA]';
    const mb = document.getElementById('mb').value || '[MB]';
    const pedido = document.getElementById('pedido').value || '[PEDIDO]';
    const r = document.getElementById('r').value || '[R]';
    const cajas = document.getElementById('cajas').value.trim() || '[CANTIDAD]';
    const nota = document.getElementById('nota').value || '[NOTA]';
    const dr = document.getElementById('dr').value || '[DR]';
    const entrega = document.getElementById('entrega').value || '[ENTREGA]';
    const recibe = document.getElementById('recibe').value || '[RECIBE]';

    return `📦 REGISTRO DE ENTREGA DIGITAL
📍Destino: ${destino}
🚪Puerta: ${puertaVal}

🔖 DATOS DEL PRODUCTO
MB: ${mb}

📋 DETALLES DEL ENVÍO
Pedido: ${pedido}
R: ${r}

🟦 CAJAS AZULES: ${cajas}
📌 NOTA DE ENTREGA
N°: ${nota}
DR: ${dr}

👤 INSPECTORES
Inspector que entrega: ${entrega}
Inspector que recibe: ${recibe}`;
  }

  function actualizarPreview() {
    document.getElementById('preview').innerText = obtenerTextoReporte();
  }

  function copiarReporte() {
    navigator.clipboard.writeText(obtenerTextoReporte()).then(() => {
      alert('¡Reporte copiado al portapapeles!');
    });
  }

  function abrirWhatsApp() {
    const texto = encodeURIComponent(obtenerTextoReporte());
    window.open(`https://wa.me/?text=${texto}`, '_blank');
  }

  function exportarTXT() {
    const blob = new Blob([obtenerTextoReporte()], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Reporte_DAKA_${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportarPDF() {
    window.print();
  }

  function exportarExcel() {
    const data = [
      ["Campo", "Valor"],
      ["Destino", document.getElementById('destino').value],
      ["Puerta", document.getElementById('puerta').value],
      ["MB", document.getElementById('mb').value],
      ["Pedido", document.getElementById('pedido').value],
      ["R", document.getElementById('r').value],
      ["Cajas", document.getElementById('cajas').value],
      ["Nota", document.getElementById('nota').value],
      ["DR", document.getElementById('dr').value],
      ["Entrega", document.getElementById('entrega').value],
      ["Recibe", document.getElementById('recibe').value]
    ];
    let csvContent = "data:text/csv;charset=utf-8," + data.map(e => e.join(",")).join("\n");
    const encodedUri = encodeURI(csvContent);
    const a = document.createElement('a');
    a.href = encodedUri;
    a.download = `Registro_DAKA_${Date.now()}.csv`;
    a.click();
  }

  function guardarRegistroHistorial() {
    const registro = {
      id: Date.now(),
      fecha: new Date().toLocaleString(),
      destino: document.getElementById('destino').value,
      mb: document.getElementById('mb').value,
      texto: obtenerTextoReporte()
    };
    let historial = JSON.parse(localStorage.getItem('daka_historial') || '[]');
    historial.unshift(registro);
    if (historial.length > 20) historial.pop();
    localStorage.setItem('daka_historial', JSON.stringify(historial));
    renderizarHistorial();
    alert('Registro guardado en el historial.');
  }

  function renderizarHistorial() {
    const container = document.getElementById('historyList');
    if (!container) return;
    const historial = JSON.parse(localStorage.getItem('daka_historial') || '[]');
    container.innerHTML = '';
    historial.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <span>${item.fecha} - ${item.destino || 'Sin destino'} (MB: ${item.mb || 'N/A'})</span>
        <div class="history-btns">
          <button onclick="cargarHistorialItem(${item.id})">📂</button>
          <button onclick="eliminarHistorialItem(${item.id})">❌</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function cargarHistorialItem(id) {
    const historial = JSON.parse(localStorage.getItem('daka_historial') || '[]');
    const item = historial.find(h => h.id === id);
    if (item) {
      document.getElementById('destino').value = item.destino || '';
      document.getElementById('mb').value = item.mb || '';
      actualizarPreview();
    }
  }

  function eliminarHistorialItem(id) {
    let historial = JSON.parse(localStorage.getItem('daka_historial') || '[]');
    historial = historial.filter(h => h.id !== id);
    localStorage.setItem('daka_historial', JSON.stringify(historial));
    renderizarHistorial();
  }

  function filtrarHistorial() {
    const query = document.getElementById('searchHistory').value.toLowerCase();
    const items = document.querySelectorAll('.history-item');
    items.forEach(item => {
      const texto = item.innerText.toLowerCase();
      item.style.display = texto.includes(query) ? 'flex' : 'none';
    });
  }

  function guardarEstadoActual() {
    const estado = {
      destino: document.getElementById('destino').value,
      puerta: document.getElementById('puerta').value,
      mb: document.getElementById('mb').value,
      pedido: document.getElementById('pedido').value,
      r: document.getElementById('r').value,
      cajas: document.getElementById('cajas').value,
      nota: document.getElementById('nota').value,
      dr: document.getElementById('dr').value,
      recibe: document.getElementById('recibe').value
    };
    localStorage.setItem('daka_estado_actual', JSON.stringify(estado));
  }

  function cargarUltimoRegistro() {
    const saved = localStorage.getItem('daka_estado_actual');
    if (!saved) return;
    try {
      const estado = JSON.parse(saved);
      document.getElementById('destino').value = estado.destino || '';
      document.getElementById('puerta').value = estado.puerta || '';
      document.getElementById('mb').value = estado.mb || '';
      document.getElementById('pedido').value = estado.pedido || '';
      document.getElementById('r').value = estado.r || '';
      document.getElementById('cajas').value = estado.cajas || '';
      document.getElementById('nota').value = estado.nota || '';
      document.getElementById('dr').value = estado.dr || '';
      document.getElementById('recibe').value = estado.recibe || '';
      actualizarPreview();
    } catch (e) {
      console.error("Error cargando estado:", e);
    }
  }

  function limpiarFormulario() {
    mbsSet.clear();
    pedidosSet.clear();
    rSet.clear();
    notasSet.clear();
    drsSet.clear();

    document.querySelectorAll('.card input[type="text"]').forEach(input => {
      if (input.id !== 'entrega') input.value = '';
    });
    document.getElementById('imageInput').value = '';
    document.getElementById('status').innerText = 'Listo para escanear múltiples QR...';
    document.getElementById('thumbs').innerHTML = '';
    localStorage.removeItem('daka_estado_actual');
    actualizarPreview();
  }
</script>

</body>
</html>
